<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">

<meta name="description" content="동네 길고양이를 함께 돌보는 지도. 정확한 위치는 저장하지 않아요.">
<meta name="theme-color" content="#f3f1e4">
<meta property="og:type" content="website">
<meta property="og:title" content="냥지도 — 우리 동네 길고양이 지도">
<meta property="og:description" content="동네 길고양이를 함께 돌보는 지도. 정확한 위치는 저장하지 않아요.">

<style>
:root{
  --bg:#f3f1e4; --fg:#2f3328; --muted:#6f7560; --block:#e0dcc7; --park:#cfe0b0;
  --accent:#e8862b; --accent-ink:#fff; --card:#fffdf6; --line:#d7d3bd;
  --display:"Gaegu","Noto Sans KR",sans-serif; --body:"Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){ :root{
  --bg:#1d1f18; --fg:#ece9d8; --muted:#a3a78f; --block:#2e3227; --park:#3d5131;
  --accent:#f09a42; --accent-ink:#1d1f18; --card:#2a2d23; --line:#444838; color-scheme:dark } }
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);display:flex;flex-direction:column;overflow:hidden;
  padding-top:env(safe-area-inset-top,0px)}
header{padding:10px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);background:var(--bg);z-index:5}
header h1{font-family:var(--display);font-size:30px;font-weight:700;margin:0;letter-spacing:-.5px;white-space:nowrap;flex:none}
header .sub{color:var(--muted);font-size:12.5px;line-height:1.35}
main{flex:1;min-height:0;display:flex;flex-direction:column}
.mapwrap{flex:1;min-height:0;position:relative}
#map{width:100%;height:100%;background:var(--block)}
.hint{position:absolute;left:50%;transform:translateX(-50%);top:10px;z-index:500;background:var(--card);border:1px solid var(--line);
  border-radius:999px;padding:6px 12px;font-size:12.5px;color:var(--muted);white-space:nowrap;pointer-events:none;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.hint.addmode{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.fab{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:16px;z-index:500;
  background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;height:52px;padding:0 20px 0 16px;
  font:700 18px var(--display);display:flex;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(0,0,0,.18);cursor:pointer}
.locbtn{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:16px;z-index:500;width:44px;height:44px;border-radius:50%;
  background:var(--card);border:1px solid var(--line);color:var(--fg);font-size:18px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.sheet{background:var(--card);border-top:1px solid var(--line);border-radius:18px 18px 0 0;
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  box-shadow:0 -8px 24px rgba(0,0,0,.08);max-height:58%;overflow-y:auto;z-index:600}
.grip{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.sheet h2{font-family:var(--display);font-size:26px;margin:0 0 2px}
.meta{color:var(--muted);font-size:13px;display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.tag{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--park);color:var(--fg)}
.tag.wary{background:var(--block)}
.note{font-size:14px;line-height:1.55;margin:0 0 12px;white-space:pre-wrap}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:10px 14px;font:500 14px var(--body);cursor:pointer;flex:1;min-width:0}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn:disabled{opacity:.5;cursor:default}
label{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 4px}
input[type=text],textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:10px 12px;font:14px var(--body)}
textarea{min-height:64px;resize:vertical}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip .sw{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:1px solid rgba(0,0,0,.2)}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.list{display:grid;gap:8px}
.item{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--bg);cursor:pointer;text-align:left;color:var(--fg);font:inherit;width:100%}
.item .nm{font-family:var(--display);font-size:19px;font-weight:700}
.item .sm{color:var(--muted);font-size:12.5px;margin-left:auto;white-space:nowrap}
.photo{width:100%;max-height:240px;object-fit:cover;border-radius:12px;display:block;margin:0 0 10px}
.thumb{width:40px;height:40px;border-radius:10px;object-fit:cover;flex:none}
.upl{display:flex;align-items:center;gap:10px}
.upl input{display:none}
.upl .prev{width:56px;height:56px;border-radius:12px;object-fit:cover;background:var(--block);flex:none}
.small{font-size:11.5px;color:var(--muted);margin-top:10px}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:84px;background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;z-index:700}
.toast[hidden]{display:none}
.catpin{cursor:pointer;line-height:0}
.catpin svg{overflow:visible;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}
.copyright{position:absolute;right:6px;bottom:4px;font-size:10px;color:#666;z-index:400;pointer-events:none}
</style>
</head>
<body>
<header>
  <h1>냥지도</h1>
  <span class="sub">같이 돌보는 길냥이 지도,<br>정확한 위치는 저장하지 않아요.</span>
</header>
<main>
  <div class="mapwrap">
    <div class="hint" id="hint" hidden></div>
    <div id="map"></div>
    <button class="locbtn" id="loc" title="내 위치로">◎</button>
    <button class="fab" id="fab">🐾 제보하기</button>
    <div class="toast" id="toast" hidden></div>
  </div>
  <section class="sheet" id="sheet" aria-live="polite">
    <div class="grip"></div>
    <div id="sheetBody"><h2>불러오는 중…</h2></div>
  </section>
</main>

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=6d60f2432d54f1354dea69c1cf91b73c&autoload=false"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
// ===== 설정 =====
const SUPABASE_URL = "https://kxxfgccmrcbvqkyjiwcd.supabase.co";
const SUPABASE_KEY = "sb_publishable_IuXz1PpELTi3I_6N7VJW-g_Gf5mKz4b";
const DEFAULT_CENTER = [37.5665, 126.9780]; // 서울시청 — 위치 권한 없을 때
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const TRAITS=["귀컷 (중성화 완료)","중성화 안 됨","다친 곳 있음","아파 보임","임신/수유 중","새끼 데리고 다님","목걸이 있음 (집냥이?)","사람 따라다님"];
const FUR={
  "노랑":{fur:"#f0a447",inner:"#f7c98a",eye:"#3b2a14",sw:"#f0a447"},
  "회색 줄무늬":{fur:"#8d9aa6",inner:"#b8c2cb",eye:"#2a2f33",stripe:"#5c6873",sw:"linear-gradient(90deg,#8d9aa6 0 40%,#5c6873 40% 60%,#8d9aa6 60%)"},
  "흰·노랑·검정":{fur:"#f1e9d8",inner:"#f1e9d8",eye:"#3b2a14",patch:["#f0a447","#3a3331"],sw:"linear-gradient(135deg,#f1e9d8 0 34%,#f0a447 34% 67%,#3a3331 67%)"},
  "검정·흰":{fur:"#3a3331",inner:"#f1e9d8",eye:"#e8d16a",sw:"linear-gradient(90deg,#3a3331 0 50%,#f1e9d8 50%)"},
  "검정":{fur:"#3a3331",inner:"#5a5250",eye:"#e8d16a",sw:"#3a3331"},
  "흰색":{fur:"#f6f3ea",inner:"#efd9d9",eye:"#3b2a14",sw:"#f6f3ea"},
  "회색":{fur:"#9a9a9a",inner:"#c4c4c4",eye:"#2a2f33",sw:"#9a9a9a"},
  "갈색":{fur:"#8a5a3c",inner:"#c9926f",eye:"#2a1f14",sw:"#8a5a3c"},
};
const OTHER="다른 색";
const CUSTOM_FUR={fur:"#b89b7a",inner:"#dcc6ad",eye:"#3b2a14"};
// 예전 이름으로 저장된 제보도 그려지게
const LEGACY={"치즈":"노랑","고등어":"회색 줄무늬","삼색":"흰·노랑·검정","턱시도":"검정·흰"};
function furOf(color){ return FUR[color]||FUR[LEGACY[color]]||CUSTOM_FUR; }
function catSvg(color,sel){
  const f=furOf(color); const r=sel?20:16;
  const patches=f.patch?`<path d="M-7 -4 a5 5 0 0 1 6 -3 l-1 7 z" fill="${f.patch[0]}"/><path d="M8 -3 a4 4 0 0 0 -6 -2 l1 6 z" fill="${f.patch[1]}"/>`:"";
  const stripes=f.stripe?`<path d="M-3 -9 l1 4 M0 -10 l0 4 M3 -9 l-1 4" stroke="${f.stripe}" stroke-width="1.6" stroke-linecap="round" fill="none"/>`:"";
  return `<svg width="${r*2+4}" height="${r*2+4}" viewBox="${-r-2} ${-r-2} ${r*2+4} ${r*2+4}" xmlns="http://www.w3.org/2000/svg"><g>
    <circle r="${r}" fill="#fffdf6" stroke="${sel?"#e8862b":"#c9c4aa"}" stroke-width="${sel?3:1.5}"/>
    <path d="M-10 -5 Q-12 -14 -5 -12 Q-2 -9 -3 -6 Z" fill="${f.fur}" stroke="${f.fur}" stroke-linejoin="round"/>
    <path d="M10 -5 Q12 -14 5 -12 Q2 -9 3 -6 Z" fill="${f.fur}" stroke="${f.fur}" stroke-linejoin="round"/>
    <path d="M-8.5 -6 Q-9.5 -11 -5.5 -10 Z" fill="${f.inner}"/><path d="M8.5 -6 Q9.5 -11 5.5 -10 Z" fill="${f.inner}"/>
    <ellipse rx="10.5" ry="9.5" cy="-1" fill="${f.fur}"/>${patches}${stripes}
    <ellipse cx="-3.6" cy="-2" rx="1.7" ry="2" fill="${f.eye}"/><ellipse cx="3.6" cy="-2" rx="1.7" ry="2" fill="${f.eye}"/>
    <circle cx="-3.1" cy="-2.6" r=".6" fill="#fff"/><circle cx="4.1" cy="-2.6" r=".6" fill="#fff"/>
    <path d="M-1.3 1.6 L1.3 1.6 L0 3 Z" fill="#d98a8a"/>
    <path d="M0 3 q-1.5 2 -3 1 M0 3 q1.5 2 3 1" stroke="${f.eye}" stroke-width=".9" fill="none" stroke-linecap="round"/>
    <g stroke="#2f3328" stroke-width=".9" stroke-linecap="round" opacity=".75">
      <path d="M-6 1 L-15 -1 M-6 2.5 L-15 3 M-6 4 L-14 7"/><path d="M6 1 L15 -1 M6 2.5 L15 3 M6 4 L14 7"/></g>
  </g></svg>`;
}
// ===== 위치 흐리기 =====
// 학대 위험 때문에 정확한 좌표는 저장하지도, 보여주지도 않아요. 약 200m 격자의 중심으로 뭉개요.
const GRID=0.0018;        // 약 200m
const GRID_SAFE=0.0045;   // 약 500m — 약한 아이는 더 넓게
const SENSITIVE=["다친 곳 있음","아파 보임","임신/수유 중","새끼 데리고 다님"];
function isSensitive(traits){ return (traits||[]).some(t=>SENSITIVE.includes(t)); }
function fuzz(lat,lng,coarse){ const g=coarse?GRID_SAFE:GRID; return {lat:(Math.floor(lat/g)+0.5)*g, lng:(Math.floor(lng/(g*1.25))+0.5)*g*1.25}; }
let circles=[];
function makeArea(lat,lng,sel,coarse){
  const color=coarse?"#5b8def":"#e8862b";
  const c=new kakao.maps.Circle({center:new kakao.maps.LatLng(lat,lng),radius:coarse?300:120,strokeWeight:sel?2:1,strokeColor:color,strokeOpacity:sel?.9:.5,fillColor:color,fillOpacity:sel?.16:.08});
  c.setMap(map); circles.push(c); return c;
}
// 보호 표시 (약한 아이)
function shieldSvg(sel){ const r=sel?20:16; return `<svg width="${r*2+4}" height="${r*2+4}" viewBox="${-r-2} ${-r-2} ${r*2+4} ${r*2+4}" xmlns="http://www.w3.org/2000/svg">
  <circle r="${r}" fill="#fffdf6" stroke="${sel?"#5b8def":"#c9c4aa"}" stroke-width="${sel?3:1.5}"/>
  <path d="M0 -10 L9 -6 V1 C9 7 4 10.5 0 12 C-4 10.5 -9 7 -9 1 V-6 Z" fill="#5b8def"/>
  <path d="M-4 0 L-1.5 2.5 L4 -3" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`; }
// ===== 나만 보기 (이 폰에만 저장) =====
const LS_KEY="nyang.private.v1";
function loadPrivate(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||"[]"); }catch(e){ return []; } }
function savePrivate(list){ try{ localStorage.setItem(LS_KEY,JSON.stringify(list)); }catch(e){} }
// 카카오맵 위에 올리는 고양이 마커
function makePin(lat,lng,color,sel,onClick,z,shield){
  const el=document.createElement("div"); el.className="catpin"; el.innerHTML=shield?shieldSvg(sel):catSvg(color,sel);
  if(onClick) el.addEventListener("click",ev=>{ ev.stopPropagation(); onClick(); });
  const ov=new kakao.maps.CustomOverlay({position:new kakao.maps.LatLng(lat,lng),content:el,yAnchor:0.5,xAnchor:0.5,zIndex:z||1});
  ov.setMap(map); ov._el=el; return ov;
}
function repaint(ov,color,sel){ ov._el.innerHTML=catSvg(color,sel); }

// ===== 지도 =====
let map;
let cats=[], markers={}, addMode=false, pending=null, ghost=null, ghostArea=null, selected=null, pendingPhoto=null;

const $=id=>document.getElementById(id);
const sheetBody=$("sheetBody"), hint=$("hint"), fab=$("fab"), toast=$("toast");
function showToast(t){ toast.textContent=t; toast.hidden=false; clearTimeout(showToast.t); showToast.t=setTimeout(()=>toast.hidden=true,2000); }
function timeAgo(iso){ const d=(Date.now()-new Date(iso))/60000; if(d<1)return"방금"; if(d<60)return`${Math.floor(d)}분 전`; if(d<1440)return`${Math.floor(d/60)}시간 전`; if(d<43200)return`${Math.floor(d/1440)}일 전`; return `${Math.floor(d/43200)}달 전`; }
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function locate(){
  if(!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(p=>{ map.setLevel(3); map.setCenter(new kakao.maps.LatLng(p.coords.latitude,p.coords.longitude)); },()=>{},{enableHighAccuracy:true,timeout:6000});
}
$("loc").onclick=locate;

async function load(){
  const {data,error}=await db.from("cats").select("*").order("last_seen",{ascending:false}).limit(2000);
  if(error){ sheetBody.innerHTML=`<h2>불러오지 못했어요</h2><p class="note">${esc(error.message)}</p>`; return; }
  // 예전에 정확한 좌표로 저장된 제보가 있으면 DB도 흐린 값으로 덮어써요 (한 번만 실행됨)
  const fixes=data.filter(c=>{ const f=fuzz(c.lat,c.lng,isSensitive(c.traits)); return Math.abs(f.lat-c.lat)>1e-9||Math.abs(f.lng-c.lng)>1e-9; });
  for(const c of fixes){ const f=fuzz(c.lat,c.lng,isSensitive(c.traits)); db.from("cats").update({lat:f.lat,lng:f.lng}).eq("id",c.id).then(()=>{}); }
  const pub=data.map(c=>Object.assign(c,fuzz(c.lat,c.lng,isSensitive(c.traits))));
  const mine=loadPrivate().map(c=>Object.assign(c,{is_private:true}));
  cats=[...mine,...pub]; renderMarkers(); renderHome();
}
function renderMarkers(){
  Object.values(markers).forEach(m=>m.setMap(null)); markers={};
  circles.forEach(c=>c.setMap(null)); circles=[];
  cats.forEach(c=>{ const sv=isSensitive(c.traits); makeArea(c.lat,c.lng,selected===c.id,sv); markers[c.id]=makePin(c.lat,c.lng,c.color,selected===c.id,()=>{ if(addMode) return; selected=c.id; renderMarkers(); renderDetail(); },1,sv); });
}
function onMapClick(e){
  if(!addMode) enterAddMode();
  pending=fuzz(e.latLng.getLat(),e.latLng.getLng());
  if(ghost) ghost.setMap(null); if(ghostArea) ghostArea.setMap(null);
  ghostArea=makeArea(pending.lat,pending.lng,true); ghost=makePin(pending.lat,pending.lng,currentColor(),true,null,1000);
  renderForm();
}
function currentColor(){ const b=sheetBody.querySelector('#f-color [aria-pressed="true"]'); if(!b) return "노랑";
  if(b.dataset.v===OTHER){ const t=sheetBody.querySelector("#f-color-custom"); return (t&&t.value.trim())||OTHER; } return b.dataset.v; }

function enterAddMode(){
  addMode=true; selected=null; pendingPhoto=null; renderMarkers();
  fab.textContent="✕ 취소"; hint.textContent="고양이를 본 근처를 누르세요 (정확한 자리는 저장 안 돼요)"; hint.classList.add("addmode"); hint.hidden=false;
}
function exitAddMode(){
  addMode=false; if(ghost){ghost.setMap(null);ghost=null;} if(ghostArea){ghostArea.setMap(null);ghostArea=null;} pending=null; pendingPhoto=null;
  fab.textContent="🐾 제보하기"; hint.hidden=true; hint.classList.remove("addmode");
}
fab.onclick=()=>{ if(addMode){ exitAddMode(); renderHome(); } else { enterAddMode(); renderForm(); } };

function renderHome(){
  if(!cats.length){ sheetBody.innerHTML=`<h2>아직 등록된 냥이가 없어요</h2><p class="note">지도를 눌러 돌보는 고양이를 등록해주세요. 위치는 약 200m 범위로만 저장돼요.</p>`; return; }
  const b=map.getBounds(); let near=cats.filter(c=>b.contain(new kakao.maps.LatLng(c.lat,c.lng))); if(!near.length) near=cats;
  const recent=near.slice(0,6);
  sheetBody.innerHTML=`<h2>${near.length===cats.length?"최근 목격된 냥이":"이 근처 냥이"}</h2>
    <div class="list">${recent.map(c=>`<button class="item" data-open="${c.id}">${c.photo_url?`<img class="thumb" src="${esc(c.photo_url)}" alt="">`:""}<span class="nm">${esc(c.name)}</span>${c.is_private?'<span class="tag wary">🔒 나만</span>':""}${isSensitive(c.traits)?'<span class="tag" style="background:#dbe7ff">🛡 보호</span>':""}<span class="tag">${esc(c.color)}</span><span class="sm">목격 ${c.seen}회 · ${timeAgo(c.last_seen)}</span></button>`).join("")}</div>
    <p class="small">🔒 모든 위치는 약 200m 범위로 흐려져 저장돼요. 정확한 급식소·잠자리 위치는 적지 말아주세요. 학대 목격 시 112.</p>`;
  sheetBody.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{ selected=b.dataset.open; const c=cats.find(x=>x.id===selected); map.panTo(new kakao.maps.LatLng(c.lat,c.lng)); renderMarkers(); renderDetail(); });
}

function renderDetail(){
  const c=cats.find(x=>x.id===selected); if(!c) return renderHome();
  sheetBody.innerHTML=`<h2>${esc(c.name)}</h2>
    <div class="meta"><span>📍 이 근처 약 ${isSensitive(c.traits)?"500":"200"}m</span><span>목격 ${c.seen}회</span><span>마지막 ${timeAgo(c.last_seen)}</span>${c.is_private?"<span>🔒 이 폰에만 저장됨</span>":""}</div>
    ${isSensitive(c.traits)?'<p class="small" style="margin:0 0 8px;background:#dbe7ff;color:#1d3f7a;padding:8px 10px;border-radius:10px">🛡 도움이 필요한 아이라 위치를 더 넓게 흐렸어요. 돌보고 계신 분이라면 메모를 확인해주세요.</p>':""}
    ${c.photo_url?`<img class="photo" src="${esc(c.photo_url)}" alt="${esc(c.name)} 사진">`:""}
    <div class="tags"><span class="tag">${esc(c.color)}</span><span class="tag ${c.temper==="경계"?"wary":""}">${esc(c.temper)}</span>${c.churu?'<span class="tag">돌보는 분 있음</span>':""}${(c.traits||[]).map(t=>`<span class="tag wary">${esc(t)}</span>`).join("")}</div>
    <p class="note">${esc(c.note)||"아직 메모가 없어요."}</p>
    <div class="row"><button class="btn primary" id="seen">오늘 봤어요 +1</button><button class="btn" id="back">목록으로</button></div>`;
  sheetBody.querySelector("#seen").onclick=async ev=>{
    ev.target.disabled=true;
    if(c.is_private){ c.seen++; c.last_seen=new Date().toISOString(); savePrivate(cats.filter(x=>x.is_private)); showToast(`${c.name} 목격 기록됨`); renderDetail(); return; }
    const {error}=await db.from("cats").update({seen:c.seen+1,last_seen:new Date().toISOString()}).eq("id",c.id);
    if(error){ showToast("저장 실패: "+error.message); ev.target.disabled=false; return; }
    c.seen++; c.last_seen=new Date().toISOString(); showToast(`${c.name} 목격 기록됨`); renderDetail();
  };
  sheetBody.querySelector("#back").onclick=()=>{ selected=null; renderMarkers(); renderHome(); };
}

function renderForm(){
  const has=!!pending;
  sheetBody.innerHTML=`<h2>${has?"어떤 냥이인가요?":"지도에서 고양이를 본 근처를 눌러주세요"}</h2>
    <p class="small" style="margin:0 0 4px">🔒 정확한 위치는 저장되지 않아요. 약 200m 범위로 흐려져요.</p>
    <label>사진</label><div class="upl"><img class="prev" id="f-prev" alt=""><label class="btn primary" for="f-photo" style="flex:none;margin:0">📷 사진 찍기 / 고르기</label><input type="file" id="f-photo" accept="image/*"><span id="f-photo-msg" class="small" style="margin:0">선택 안 함</span></div>
    <label for="f-name">별명</label><input type="text" id="f-name" placeholder="예: 치즈, 노랑이, 회장님" maxlength="12">
    <label>털 색깔</label><div class="chips" id="f-color">${Object.keys(FUR).map((k,i)=>`<button class="chip" type="button" data-v="${k}" aria-pressed="${i===0}"><span class="sw" style="background:${FUR[k].sw}"></span>${k}</button>`).join("")}<button class="chip" type="button" data-v="${OTHER}" aria-pressed="false">✏️ ${OTHER}</button></div>
    <input type="text" id="f-color-custom" placeholder="예: 갈색 줄무늬, 베이지" maxlength="12" style="margin-top:6px" hidden>
    <label>성격</label><div class="chips" id="f-temper"><button class="chip" type="button" aria-pressed="true">순함</button><button class="chip" type="button" aria-pressed="false">보통</button><button class="chip" type="button" aria-pressed="false">경계</button></div>
    <label>공개 범위</label><div class="chips" id="f-vis"><button class="chip" type="button" aria-pressed="true">🔒 나만 보기</button><button class="chip" type="button" aria-pressed="false">🌏 모두에게</button></div>
    <p class="small" id="f-vis-note" style="margin:4px 0 0">나만 보기: 이 폰에만 저장되고 서버에 올라가지 않아요. 모두에게: 약 200m 범위로 흐려져 공유돼요.</p>
    <label>돌보는 분</label><div class="chips" id="f-churu"><button class="chip" type="button" aria-pressed="false">있어요</button><button class="chip" type="button" aria-pressed="true">몰라요</button></div>
    <label>상태 · 돌봄 정보</label><div class="chips" id="f-traits">${TRAITS.map(t=>`<button class="chip" type="button" aria-pressed="false">${t}</button>`).join("")}</div>
    <label for="f-note">메모</label><textarea id="f-note" placeholder="건강 상태, 필요한 도움 등 (정확한 장소는 적지 말아주세요)"></textarea>
    <div class="row" style="margin-top:12px"><button class="btn primary" id="f-save" ${has?"":"disabled"}>제보 올리기</button></div>`;
  ["f-color","f-temper","f-churu","f-vis"].forEach(id=>sheetBody.querySelector("#"+id).querySelectorAll(".chip").forEach(ch=>ch.onclick=()=>{
    ch.parentElement.querySelectorAll(".chip").forEach(o=>o.setAttribute("aria-pressed","false")); ch.setAttribute("aria-pressed","true");
    if(id==="f-color"){ const cu=sheetBody.querySelector("#f-color-custom"); cu.hidden=ch.dataset.v!==OTHER; if(!cu.hidden) cu.focus(); if(ghost) repaint(ghost,currentColor(),true); } }));
  sheetBody.querySelector("#f-color-custom").oninput=()=>{ if(ghost) repaint(ghost,currentColor(),true); };
  sheetBody.querySelectorAll("#f-traits .chip").forEach(ch=>ch.onclick=()=>ch.setAttribute("aria-pressed",ch.getAttribute("aria-pressed")!=="true"));
  if(pendingPhoto){ sheetBody.querySelector("#f-prev").src=pendingPhoto.preview; sheetBody.querySelector("#f-photo-msg").textContent="사진 첨부됨"; }
  sheetBody.querySelector("#f-photo").onchange=ev=>{
    const file=ev.target.files[0]; if(!file) return;
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{ const max=1024,k=Math.min(1,max/Math.max(img.width,img.height));
      const cv=document.createElement("canvas"); cv.width=Math.round(img.width*k); cv.height=Math.round(img.height*k);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      cv.toBlob(blob=>{ pendingPhoto={blob,preview:cv.toDataURL("image/jpeg",.6)}; sheetBody.querySelector("#f-prev").src=pendingPhoto.preview; sheetBody.querySelector("#f-photo-msg").textContent="사진 첨부됨"; URL.revokeObjectURL(url); },"image/jpeg",.82); };
    img.src=url; };
  sheetBody.querySelector("#f-save").onclick=async ev=>{
    ev.target.disabled=true; ev.target.textContent="올리는 중…";
    const name=sheetBody.querySelector("#f-name").value.trim()||"이름 없는 냥이";
    const color=currentColor();
    const temper=sheetBody.querySelector('#f-temper [aria-pressed="true"]').textContent;
    const churu=sheetBody.querySelector('#f-churu [aria-pressed="true"]').textContent==="있어요";
    const traits=[...sheetBody.querySelectorAll('#f-traits [aria-pressed="true"]')].map(b=>b.textContent);
    const note=sheetBody.querySelector("#f-note").value.trim();
    const isPrivate=sheetBody.querySelector('#f-vis [aria-pressed="true"]').textContent.includes("나만");
    const pos=fuzz(pending.lat,pending.lng,isSensitive(traits));
    if(isPrivate){
      const now=new Date().toISOString();
      const row={id:"p"+Date.now(),name,color,temper,churu,traits,note,photo_url:pendingPhoto?pendingPhoto.preview:null,lat:pos.lat,lng:pos.lng,seen:1,last_seen:now,created_at:now,is_private:true};
      const list=loadPrivate(); list.unshift(row); savePrivate(list);
      cats.unshift(row); exitAddMode(); selected=row.id; renderMarkers(); renderDetail(); showToast(`${name} 등록 완료 🔒 이 폰에만 저장됐어요`); return;
    }
    let photo_url=null;
    if(pendingPhoto){
      const path=`${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
      const {error:ue}=await db.storage.from("photos").upload(path,pendingPhoto.blob,{contentType:"image/jpeg"});
      if(ue){ showToast("사진 업로드 실패: "+ue.message); ev.target.disabled=false; ev.target.textContent="제보 올리기"; return; }
      photo_url=db.storage.from("photos").getPublicUrl(path).data.publicUrl;
    }
    const {data,error}=await db.from("cats").insert({name,color,temper,churu,traits,note,photo_url,lat:pos.lat,lng:pos.lng}).select().single();
    if(error){ showToast("저장 실패: "+error.message); ev.target.disabled=false; ev.target.textContent="제보 올리기"; return; }
    cats.unshift(data); exitAddMode(); selected=data.id; renderMarkers(); renderDetail(); showToast(`${name} 등록 완료 🐾 위치는 흐려져 저장됐어요`);
  };
}
kakao.maps.load(()=>{
  map=new kakao.maps.Map($("map"),{center:new kakao.maps.LatLng(DEFAULT_CENTER[0],DEFAULT_CENTER[1]),level:4});
  kakao.maps.event.addListener(map,"click",onMapClick);
  kakao.maps.event.addListener(map,"idle",()=>{ if(!addMode&&!selected) renderHome(); });
  locate(); load();
});
</script>
</body>
</html>
